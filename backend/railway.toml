# Railway service configuration for the backend.
#
# Set the service's **Root Directory** to `backend/`; this file and the Dockerfile are resolved
# relative to it. The Studio is a separate repository and deploys as its own service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Schema first, then traffic. `upgrade head` is idempotent, so a redeploy that adds no migration is
# a no-op — and a deploy that needs one cannot serve requests against the old schema.
# Railway's schema documents `preDeployCommand` as an **array**, not a string. A string may simply
# be ignored, which would skip the migration and start the app against an unmigrated database.
preDeployCommand = "alembic upgrade head"
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers --forwarded-allow-ips=* --timeout-keep-alive 75"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
