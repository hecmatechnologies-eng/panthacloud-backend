[project]
name = "fussion-backend"
version = "0.1.0"
description = "Fussion AI Integration Engineer Platform - Backend Control Plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "cryptography>=43.0.0",
    "pyyaml>=6.0.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
    # UTS-46 host canonicalisation for allowed origins; the stdlib codec is IDNA2003 and
    # disagrees with browsers (app/core/origins.py).
    "idna>=3.7",
    "google-genai>=1.0.0",
    "openai>=1.40.0",
    "pydantic-ai>=2.43.0",
    "pgvector>=0.5.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    # Agent Skills reference validator (FR-083b); dev/CI only.
    "skills-ref>=0.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
